          {id:"frontend",x:930,y:215,w:250,h:130,icon:"—",step:"PLANNED",title:"Frontend",body:"Read APIs exist; no app or dashboard code is present.",code:"generic API client",kind:"muted"}
        ],edges:[],
        note:"<strong>Technology actually used:</strong> FastAPI, Pydantic, SQLAlchemy, psycopg, PostgreSQL and Alembic. Docker Compose defines only a local PostgreSQL service.",
        takeaway:"The visualization separates working backend capabilities from proposal-stage AI, frontend, auth, queues and external services.",
        source:"backend/app/* · backend/docker-compose.yml · src/industrial_safety/* · README.md"
      }
    ];

    const $ = selector => document.querySelector(selector);
    const viewport = $('#viewport'), stage = $('#stage'), nodesEl = $('#nodes'), edgesEl = $('#edge-items');
    let index = 0, playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches, elapsed = 0, last = performance.now();

    const glyphs = {
      JSON:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>',
      API:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 10h10M7 14h6"/>',
      VAL:'<path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5z"/><path d="m8.5 12 2.2 2.2 4.8-5"/>',
      SVC:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/>',
      DB:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/>',
      GET:'<path d="M4 7h16M4 12h12M4 17h8"/><path d="m17 10 3 2-3 2"/>',
      SQL:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/>',
      EVT:'<path d="M5 3h14v18H5zM9 8h6M9 12h6M9 16h4"/>',
      VIO:'<path d="m12 3 9 16H3z"/><path d="M12 9v5m0 3h.01"/>',
      ALT:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
      OK:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
      UNQ:'<circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/>',
      HLT:'<path d="M3 12h4l2-4 4 8 2-4h6"/><path d="M5 5a9 9 0 0 1 14 0M5 19a9 9 0 0 0 14 0"/>',
      POST:'<path d="M3 12h17M14 6l6 6-6 6"/>',
      '201':'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
      '409':'<path d="M4 12a8 8 0 1 0 2-5.3M4 4v5h5"/><path d="M12 8v5l3 2"/>',
      '422':'<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/>',
      '500':'<path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5z"/><path d="m9 9 6 6m0-6-6 6"/>',
      '—':'<circle cx="12" cy="12" r="9"/><path d="M6 18 18 6"/>'
    };
    function iconMarkup(key){return glyphs[key]?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">${glyphs[key]}</svg>`:escapeHTML(key);}

    function fit(){
      const scale = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
      stage.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', fit);
    fit();

    function anchor(a,b){
      const ax=a.x+a.w/2, ay=a.y+a.h/2, bx=b.x+b.w/2, by=b.y+b.h/2;
      if(Math.abs(bx-ax)>Math.abs(by-ay)*.78){
        const x1=bx>ax?a.x+a.w:a.x, x2=bx>ax?b.x:b.x+b.w;
        const y1=ay, y2=by, bend=Math.max(50,Math.abs(x2-x1)*.48);
        return {d:`M ${x1} ${y1} C ${x1+(bx>ax?bend:-bend)} ${y1}, ${x2-(bx>ax?bend:-bend)} ${y2}, ${x2} ${y2}`,lx:(x1+x2)/2,ly:(y1+y2)/2-12};
      }
      const x1=ax,x2=bx,y1=by>ay?a.y+a.h:a.y,y2=by>ay?b.y:b.y+b.h;
      return {d:`M ${x1} ${y1} C ${x1} ${(y1+y2)/2}, ${x2} ${(y1+y2)/2}, ${x2} ${y2}`,lx:(x1+x2)/2+18,ly:(y1+y2)/2};
    }
    function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function render(){
      const s=scenes[index];
      $('#eyebrow').textContent=s.eyebrow;$('#title').textContent=s.title;$('#subtitle').textContent=s.subtitle;
      $('#scene-num').textContent=String(index+1).padStart(2,'0');$('#scene-total').textContent=` / ${String(scenes.length).padStart(2,'0')}`;
      $('#scene-status').textContent=s.status;$('#takeaway').textContent=s.takeaway;$('#source').textContent=s.source;
      $('#micro-note').innerHTML=s.note;
      nodesEl.innerHTML=s.nodes.map((n,i)=>`<article class="node ${n.kind||''} ${n.h<180?'compact':''}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px;animation-delay:${.12+i*.1}s"><div class="node-top"><span class="icon">${iconMarkup(n.icon)}</span><span class="node-step">${escapeHTML(n.step)}</span></div><h2>${escapeHTML(n.title)}</h2><p>${escapeHTML(n.body)}</p><code>${escapeHTML(n.code)}</code></article>`).join('');
      const byId=Object.fromEntries(s.nodes.map(n=>[n.id,n]));
      edgesEl.innerHTML=s.edges.map((e,i)=>{
        const {d,lx,ly}=e.path?{d:e.path,lx:e.lx,ly:e.ly}:anchor(byId[e.from],byId[e.to]);const kind=e.kind||'';
        const marker=kind==='error'?'arrow-error':kind==='alt'?'arrow-alt':'arrow';
        return `<path class="edge ${kind}" d="${d}" marker-end="url(#${marker})" style="animation-delay:${.25+i*.17}s"></path><text class="edge-label" x="${lx}" y="${ly}" text-anchor="middle">${escapeHTML(e.label)}</text>${kind==='soft'?'':`<circle class="packet ${kind}" r="4.5"><animateMotion dur="3.2s" begin="${i*.3}s" repeatCount="indefinite" path="${d}"></animateMotion></circle>`}`;
      }).join('');
      $('#scene-tabs').innerHTML=scenes.map((v,i)=>`<button class="scene-pill ${i===index?'active':''}" data-scene="${i}" aria-label="Scene ${i+1}: ${escapeHTML(v.tab)}" ${i===index?'aria-current="step"':''}>${String(i+1).padStart(2,'0')} ${escapeHTML(v.tab)}</button>`).join('');
      document.querySelectorAll('[data-scene]').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.scene))));
      $('#play').textContent=playing?'Pause':'Play';$('#play').setAttribute('aria-label',playing?'Pause autoplay':'Start autoplay');
      elapsed=0;$('#progress').style.width='0%';
    }
    function go(i){index=(i+scenes.length)%scenes.length;render();}
    function toggle(){playing=!playing;$('#play').textContent=playing?'Pause':'Play';$('#play').setAttribute('aria-label',playing?'Pause autoplay':'Start autoplay');}
    function tick(now){
      if(playing){elapsed+=Math.min(100,now-last);if(elapsed>=DURATION)go(index+1);$('#progress').style.width=`${Math.min(100,elapsed/DURATION*100)}%`;}
      last=now;requestAnimationFrame(tick);
    }
    $('#prev').addEventListener('click',()=>go(index-1));$('#next').addEventListener('click',()=>go(index+1));$('#play').addEventListener('click',toggle);
    $('#full').addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():viewport.requestFullscreen());
    document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft',' ','f','F'].includes(e.key))e.preventDefault();if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1);if(e.key===' ')toggle();if(e.key.toLowerCase()==='f')$('#full').click();});
    render();requestAnimationFrame(tick);
  </script>
</body>
