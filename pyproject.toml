[project]
name = "industrial-safety-ai"
version = "0.1.0"
description = "Real-time industrial safety monitoring system"
readme = "README.md"
requires-python = ">=3.10"
   dependencies = [
       "numpy>=1.24",
       "supervision==0.30.6",
   ]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5",
    "ruff==0.16.9",
    "pre-commit>=3.7",
]
dvc = [
    "dvc>=3.0",
]
backend = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "SQLAlchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
]

dvc = [
    "dvc[gdrive]==3.67.1",
    # PyDrive2 needs pyOpenSSL<=24.2.1, which needs cryptography<44
    "cryptography<44",
    "pyOpenSSL==24.2.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["industrial_safety*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
