[project]
name = "industrial-safety-ai"
version = "0.1.0"
description = "Real-time industrial safety monitoring system"
readme = "README.md"
requires-python = ">=3.10"
   dependencies = [
       "numpy>=1.24",
       "supervision==0.30.6",
   ]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5",
    "ruff==0.16.9",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["industrial_safety*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
