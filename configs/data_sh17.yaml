# Class order for the SH17-derived PPE dataset (fixed - do not reorder).
# `python -m industrial_safety.data_prep.prepare_dataset` writes a copy of this
# file with the real `path` into <DATA_ROOT>/sh17_yolo/data.yaml. Train with that copy.
path: ../data/sh17_yolo   # placeholder; the generated copy has the resolved path
train: train/images
val: val/images
test: test/images
names:
  0: face-mask-medical
  1: glasses
  2: gloves
  3: helmet
  4: shoes
  5: protective-suit
  6: safety-vest
  7: person
